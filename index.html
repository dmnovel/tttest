<style>

:root{

.page{width:min(720px,calc(100% - 40px));max-width:720px;margin:0 auto;padding:14px 0 56px}
header{margin-bottom:12px}.title{margin:0 0 6px;font-size:clamp(24px,5vw,34px);letter-spacing:-.04em}.desc{margin:0;color:var(--muted);font-size:14px}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px;margin-bottom:10px}

input,select,button{width:100%;min-height:40px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--text);font:inherit;padding:0 12px}
input:focus,select:focus,button:focus{outline:none;border-color:#B78A96;box-shadow:0 0 0 3px rgba(183,132,143,.16)}
button{cursor:pointer;font-weight:900;background:var(--accent);color:#fff;border-color:var(--accent);white-space:nowrap}

.summary{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 0 8px;color:var(--muted);font-size:14px}.summary strong{color:var(--text);font-size:18px}

.list{display:grid;gap:10px}.card{background:var(--card);border:1px solid #E3DED8;border-radius:12px;box-shadow:var(--shadow);padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto 96px;gap:16px;align-items:center}.card-info{min-width:0;padding-right:0}
.book-title{display:block;margin:0 0 7px;color:#242220;font-size:17px;font-weight:950;line-height:1.35;letter-spacing:-.015em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.book-title:hover{color:var(--accent-dark);text-decoration:underline;text-underline-offset:3px}.book-title.no-link:hover{text-decoration:none;color:#2B2927}
.book-meta{margin:0;color:#5D5752;font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.card-middle{position:static;transform:none;width:max-content;max-width:260px;text-align:center;pointer-events:auto;justify-self:center}.book-history-inline{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:nowrap}.history-pill{display:inline-flex;align-items:center;justify-content:center;min-height:30px;padding:0 12px;border-radius:999px;background:#F1E6E9;border:1px solid #DED6D2;color:#9B6F7B;font-size:13px;font-weight:900;line-height:1;white-space:nowrap;letter-spacing:-.02em}.history-pill.recent{background:#F7F5F2;border-color:#E3DED8;color:#6A625C}
.card-actions{display:grid;grid-template-columns:1fr;gap:9px;width:96px;min-width:96px;justify-self:start}
.history-btn,.move-btn{width:96px;min-height:40px;border-radius:12px;font-size:14px;font-weight:950;display:inline-flex;align-items:center;justify-content:center;padding:0 10px;text-align:center}
.history-btn{background:var(--brown);border-color:var(--brown);color:#fff}.history-btn:hover{background:var(--brown-dark);border-color:var(--brown-dark)}.history-btn.disabled{opacity:.45;cursor:not-allowed;filter:none;pointer-events:none}
.move-btn{background:#fff;color:var(--brown);border:1px solid #D8D1CC}.move-btn:hover{background:#F7F5F2}
.empty,.error{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:28px 18px;text-align:center;color:var(--muted)}.empty.prompt{min-height:280px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;color:#77706A;background:transparent;border:1px dashed var(--line);box-shadow:none}.error{color:#9b3b35}.hidden{display:none!important}.load-more-wrap{margin-top:18px;display:flex;justify-content:center}.load-more-wrap button{width:min(280px,100%);min-height:46px}
.float-nav{position:fixed;right:16px;bottom:18px;z-index:25;display:grid;gap:8px}.float-nav button{width:44px;height:44px;min-height:44px;border-radius:999px;padding:0;box-shadow:0 8px 20px rgba(70,55,48,.12);background:#fff;color:var(--brown);border-color:var(--line);font-size:18px}
.history-modal-backdrop,.date-index-backdrop,.taste-modal-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:80;padding:18px;align-items:center;justify-content:center}.history-modal-backdrop.open,.date-index-backdrop.open,.taste-modal-backdrop.open{display:flex}.history-modal,.date-index-modal,.taste-modal{width:min(460px,100%);max-height:82vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 24px rgba(70,55,48,.14);padding:20px}.date-index-modal{width:min(560px,100%)}.history-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}.history-head h2{margin:0;font-size:17px;font-weight:950;letter-spacing:-.03em;line-height:1.45;color:#2B2927}.history-close{width:34px!important;min-height:34px!important;padding:0!important;border-radius:999px!important;background:#F3EEEE!important;color:var(--brown)!important;border:1px solid #DED6D2!important;flex:0 0 auto}.history-meta{margin:0 0 15px;color:#4E4843;font-size:13px;font-weight:800;line-height:1.45}.history-list{display:grid;gap:9px}.history-row{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid #DED6D2;background:#FAF9F7;border-radius:13px;padding:11px 12px}.history-date{font-weight:950;color:#4E4843;font-size:15px}.history-rate{font-weight:950;color:#fff;background:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:5px 12px;min-width:58px;text-align:center;box-shadow:0 2px 8px rgba(169,120,130,.18)}.history-empty{padding:18px 12px;text-align:center;color:var(--muted);border:1px dashed #DED6D2;border-radius:13px;background:#FAF9F7}.date-index-desc{margin:0 0 12px;color:var(--muted);font-size:13px;font-weight:700}.date-index-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(124px,1fr));gap:8px}.date-chip{min-height:40px;border-radius:999px;background:#FAF9F7;color:var(--brown);border:1px solid #DED6D2;font-size:13px;font-weight:950}.date-chip:hover{background:#F1E6E9}.date-chip.active{background:var(--accent);border-color:var(--accent);color:#fff}.clear-date-btn{width:auto!important;min-height:34px!important;padding:0 12px!important;background:#fff!important;color:var(--brown)!important;border-color:#D8D1CC!important;border-radius:999px!important;font-size:12px!important}

.taste-card-list{display:grid;gap:10px;margin-top:12px}
.taste-card{background:#FAF9F7;border:1px solid var(--line);border-radius:14px;padding:13px 14px;box-shadow:0 2px 10px rgba(80,55,45,.035)}
.taste-card-title{margin:0 0 5px;color:#2B2927;font-size:15px;font-weight:950;letter-spacing:-.03em;line-height:1.35}
.taste-card-desc{margin:0;color:var(--muted);font-size:13px;font-weight:700;line-height:1.5}
@media(max-width:980px){.top-link-row,.page{width:min(100% - 24px,720px)}.top-link-row{margin-top:12px}.blank-top-btn,.top-menu-btn,.heart-top-btn{width:62px;min-height:34px}.blank-top-btn.small,.heart-top-btn.small{width:38px}.search-row,.detail-row{grid-template-columns:1fr}.quick-row{grid-template-columns:minmax(120px,1fr) auto auto;gap:8px}.quick-row>div:nth-child(2){width:72px}.detail-toggle-btn{display:block;width:42px;min-height:44px;border-radius:14px;padding:0;font-size:18px;line-height:1}.detail-row.mobile-collapsed{display:none}.summary{align-items:flex-start;flex-direction:column}.active-summary{text-align:left;white-space:normal}.card{grid-template-columns:1fr;gap:12px;padding:16px}.card-info{padding-right:0}.book-title{white-space:normal;font-size:16px}.book-meta{white-space:normal}.card-middle{width:auto;max-width:none;text-align:left;justify-self:start}.book-history-inline{justify-content:flex-start;flex-wrap:wrap}.card-actions{grid-template-columns:1fr 1fr;width:100%;min-width:0}.history-btn,.move-btn{width:100%}.float-nav button{width:40px;height:40px;min-height:40px}}

}

}

/* neutral flat polish: CSS only, no layout/function changes */
body{
  background:#FAF9F7;
}
.panel,
.card,
.empty,
.error,
.install-banner,
.history-modal,
.date-index-modal,
.taste-modal,
.taste-card{
  border-radius:4px !important;
  border-color:#E3DED8 !important;
  box-shadow:0 1px 4px rgba(45,42,38,.035) !important;
}
input,
select,
button,
.back-to-main,
.top-menu-btn,
.heart-top-btn,
.blank-top-btn,
.history-btn,
.move-btn,
.load-more-wrap button{
  border-radius:4px !important;
}
.history-pill,
.history-pill.recent,
.history-rate,
.date-chip,
.clear-date-btn{
  border-radius:4px !important;
}
.float-nav button,
.history-close,
.favorite-toggle,
.blank-top-btn.small,
.heart-top-btn.small{
  border-radius:4px !important;
}
.search-row input,
.detail-row input,
select{
  background:#FFFFFF;
  border-color:#E3DED8;
  box-shadow:none;
}
input:focus,
select:focus,
button:focus{
  border-color:#B78A96;
  box-shadow:0 0 0 2px rgba(183,138,150,.13);
}
button{
  box-shadow:none;
}
.card{
  background:#FFFFFF;
}
.book-title{
  color:#242220;
}
.book-meta{
  color:#5D5752;
}
.history-pill{
  background:#F1E6E9;
  border-color:#DED6D2;
  color:#9B6F7B;
}
.history-pill.recent{
  background:#F7F5F2;
  border-color:#E3DED8;
  color:#6A625C;
}
.history-row,
.history-empty,
.date-chip{
  border-radius:4px !important;
  background:#FAF9F7;

.move-btn,
.top-menu-btn,
.heart-top-btn,
.float-nav button{

/* make list view icon wider only */
@media(max-width:980px){
  .list-view-icon{
    width:16px;
    height:11px;
    display:inline-block;
    background:
      linear-gradient(currentColor,currentColor) left top / 100% 1.5px no-repeat,
      linear-gradient(currentColor,currentColor) left center / 100% 1.5px no-repeat,
      linear-gradient(currentColor,currentColor) left bottom / 100% 1.5px no-repeat;
  }

/* card view icon: 2x2 squares balanced with list icon */
@media(max-width:980px){
  .card-view-icon{
    width:16px;
    height:14px;
    display:grid;
    grid-template-columns:repeat(2, 6px);
    grid-template-rows:repeat(2, 6px);
    gap:2px;
    align-items:center;
    justify-content:center;
  }
  .card-view-icon::before{
    content:"";
    width:6px;
    height:6px;
    background:currentColor;
    box-shadow:
      8px 0 0 currentColor,
      0 8px 0 currentColor,
      8px 8px 0 currentColor;
  }
}

    function openHistoryModal(item){const backdrop=document.getElementById("historyModalBackdrop"),title=document.getElementById("historyModalTitle"),meta=document.getElementById("historyModalMeta"),body=document.getElementById("historyModalBody");if(!backdrop||!title||!meta||!body)return;title.textContent=item.title||"과거 할인율";meta.textContent=(item.author||"작가 정보 없음")+" · 과거 마크다운 할인율";body.innerHTML="";const entries=parseHistory(item.history);if(!entries.length){const empty=document.createElement("div");empty.className="history-empty";empty.textContent="정리된 과거 할인율이 없습니다.";body.appendChild(empty)}else{entries.forEach(entry=>{const row=document.createElement("div");row.className="history-row";const date=document.createElement("span");date.className="history-date";date.textContent=entry.date||"기록";const rate=document.createElement("span");rate.className="history-rate";rate.textContent=entry.rate;row.append(date,rate);body.appendChild(row)})}backdrop.classList.add("open");backdrop.setAttribute("aria-hidden","false");document.body.classList.add("modal-open")}

    function renderCartMount(mount){const active=document.activeElement;const keepFocus=active&&active.id==="targetPriceInput"&&mount.contains(active);const selectionStart=keepFocus?active.selectionStart:null;const selectionEnd=keepFocus?active.selectionEnd:null;mount.innerHTML="";const cart=buildCartHtml();mount.appendChild(cart);const input=mount.querySelector("#targetPriceInput");if(input){input.addEventListener("input",debounce(e=>saveTarget(e.target.value),180));if(keepFocus){input.focus();try{input.setSelectionRange(selectionStart,selectionEnd)}catch{}}}const copy=mount.querySelector('[data-action="copy"]');if(copy)copy.addEventListener("click",copyCartList);const clear=mount.querySelector('[data-action="clear"]');if(clear)clear.addEventListener("click",clearCart);mount.querySelectorAll("[data-remove-id]").forEach(b=>b.addEventListener("click",()=>removeFromCart(b.getAttribute("data-remove-id"))))}
    function setMobileTab(tab){state.activeMobileTab=tab;document.body.classList.toggle("mobile-list-mode",tab==="list");document.body.classList.toggle("mobile-cart-mode",tab==="cart");if(els.tabSearchBtn)els.tabSearchBtn.classList.toggle("active",tab==="search");if(els.tabListBtn)els.tabListBtn.classList.toggle("active",tab==="list");if(els.tabCartBtn)els.tabCartBtn.classList.toggle("active",tab==="cart");renderCart();window.scrollTo({top:0,behavior:"smooth"})}
    function renderMobilePickedList(){if(!els.mobileListMount)return;const items=getFavoriteItems();if(els.mobileListCount)els.mobileListCount.textContent=items.length.toLocaleString("ko-KR")+"개";els.mobileListMount.innerHTML="";if(!items.length){const e=document.createElement("div");e.className="mobile-picked-empty";e.textContent="찜한 작품이 없습니다.";els.mobileListMount.appendChild(e);return}items.forEach(item=>{const row=document.createElement("div");row.className="mobile-picked-item";const text=document.createElement("div");const title=document.createElement(item.link?"a":"p");title.className="mobile-picked-title";title.textContent=item.title||"(제목 없음)";if(item.link){title.href=item.link;title.target="_blank";title.rel="noopener noreferrer"}const meta=document.createElement("p");meta.className="mobile-picked-meta";meta.textContent=`${item.author||"작가 정보 없음"} · ${formatPrice(item.price)}`;text.append(title,meta);const btn=document.createElement("button");btn.type="button";btn.className="mobile-picked-remove";btn.textContent="찜해제";btn.addEventListener("click",()=>toggleFavorite(item.id));row.append(text,btn);els.mobileListMount.appendChild(row)})}
    function renderCart(){renderCartMount(els.desktopCartMount);renderCartMount(els.mobileCartMount);if(els.mobileTabCartMount)renderCartMount(els.mobileTabCartMount);renderMobilePickedList();const count=state.cartIds.size,total=getCartTotal(),target=Number(state.targetPrice||0),remain=target-total;els.mobileCartSummary.textContent=`장바구니 ${count}개 · 총 ${formatPrice(total)}`;els.mobileRemainSummary.textContent=!target?"목표금액을 입력하면 남은금액이 표시됩니다":remain>=0?`목표까지 ${formatPrice(remain)} 남음`:`목표보다 ${formatPrice(Math.abs(remain))} 초과`}
    function openCartSheet(){els.cartSheetBackdrop.classList.add("open");els.cartSheet.classList.add("open");document.body.classList.add("modal-open")}
    function closeCartSheet(){els.cartSheetBackdrop.classList.remove("open");els.cartSheet.classList.remove("open");document.body.classList.remove("modal-open")}
    function debounce(fn,delay){let timer;return(...args)=>{clearTimeout(timer);timer=setTimeout(()=>fn(...args),delay)}}
    function bindEvents(){initTopRidiLink();initTastePopover();els.searchBtn.addEventListener("click",applyFilters);els.q.addEventListener("input",debounce(applyFilters,180));els.discountFilter.addEventListener("change",applyFilters);els.pricePreset.addEventListener("change",()=>{if(els.pricePreset.value){els.minPrice.value="";els.maxPrice.value=""}applyFilters()});els.sortBy.addEventListener("change",applyFilters);els.resetTopBtn.addEventListener("click",resetAll);els.detailBtn.addEventListener("click",()=>{const open=!els.detail.classList.contains("open");els.detail.classList.toggle("open",open);els.detailBtn.setAttribute("aria-expanded",String(open));els.detailBtn.textContent=open?"상세검색 닫기 ▴":"상세검색 열기 ▾"});els.applyDetailBtn.addEventListener("click",()=>{if(els.minPrice.value||els.maxPrice.value)els.pricePreset.value="";applyFilters()});els.resetDetailBtn.addEventListener("click",()=>resetDetail(true));[els.titleOnly,els.authorOnly,els.exclude,els.minPrice,els.maxPrice].forEach(input=>input.addEventListener("input",debounce(()=>{if(input===els.minPrice||input===els.maxPrice)els.pricePreset.value="";applyFilters()},200)));els.typeFilter.addEventListener("change",applyFilters);els.loadMoreBtn.addEventListener("click",()=>{state.visibleCount+=PAGE_SIZE;render()});els.openCartSheetBtn.addEventListener("click",openCartSheet);els.closeCartSheetBtn.addEventListener("click",closeCartSheet);els.cartSheetBackdrop.addEventListener("click",closeCartSheet);if(els.tabSearchBtn)els.tabSearchBtn.addEventListener("click",()=>setMobileTab("search"));if(els.tabListBtn)els.tabListBtn.addEventListener("click",()=>setMobileTab("list"));if(els.tabCartBtn)els.tabCartBtn.addEventListener("click",()=>setMobileTab("cart"));document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeCartSheet();closeHistoryModal()}});const historyBackdrop=document.getElementById("historyModalBackdrop"),historyClose=document.getElementById("historyModalClose");if(historyBackdrop)historyBackdrop.addEventListener("click",e=>{if(e.target===historyBackdrop)closeHistoryModal()});if(historyClose)historyClose.addEventListener("click",closeHistoryModal);els.goTopBtn.addEventListener("click",()=>document.getElementById("top").scrollIntoView({behavior:"smooth",block:"start"}));els.goBottomBtn.addEventListener("click",()=>els.bottomAnchor.scrollIntoView({behavior:"smooth",block:"end"}))}
    async function loadData(){try{const res=await fetch("./events.json",{cache:"no-store"});if(!res.ok)throw new Error("events.json 파일을 찾을 수 없습니다.");state.raw=await res.json();if(!Array.isArray(state.raw))throw new Error("events.json은 배열 형식이어야 합니다.")}catch(e){els.error.classList.remove("hidden");els.error.textContent="events.json을 불러오지 못했습니다. index.html과 같은 위치에 events.json을 올려주세요.";state.raw=[]}state.items=state.raw.map(normalizeItem).filter(i=>i.title||i.author);loadCart();const valid=new Set(state.items.map(i=>i.id));state.cartIds=new Set([...state.cartIds].filter(id=>valid.has(id)));state.favoriteIds=new Set([...state.favoriteIds].filter(id=>valid.has(id)));saveCart();saveFavorites();populateFilters();bindEvents();applyFilters()}
    loadData();
  </script>

  <script>
    (function(){
      const btn = document.getElementById("mobileFilterToggle");
      const body = document.getElementById("mobileFilterBody");
      if(!btn || !body) return;
      function setOpen(open){
        body.classList.toggle("open", open);
        btn.setAttribute("aria-expanded", open ? "true" : "false");
        btn.textContent = open ? "필터 접기 ▴" : "필터 열기 ▾";
      }
      btn.addEventListener("click", function(){ setOpen(!body.classList.contains("open")); });
      const mq = window.matchMedia("(max-width: 980px)");
      function init(){ if(mq.matches) setOpen(false); else setOpen(true); }
      mq.addEventListener("change", init);
      init();
    })();
  </script>


  <script>
    (function(){
      const searchRow = document.querySelector(".search-row");
      const mainSlot = document.getElementById("mainSearchSlot");
      const sideSlot = document.getElementById("sideSearchMount");
      const mq = window.matchMedia("(min-width: 981px)");

      function placeSearch(){
        if(!searchRow || !mainSlot || !sideSlot) return;
        if(mq.matches){
          if(searchRow.parentElement !== sideSlot) sideSlot.appendChild(searchRow);
        } else {
          if(searchRow.parentElement !== mainSlot.parentElement) {
            mainSlot.insertAdjacentElement("afterend", searchRow);
          }
        }
      }

      mq.addEventListener("change", placeSearch);
      placeSearch();

      const cartPanel = document.querySelector(".compact-cart");
      const cartToggle = document.getElementById("desktopCartToggle");
      const cartBody = document.getElementById("desktopCartBody");

      function setCartOpen(open){
        if(!cartPanel || !cartToggle || !cartBody) return;
        cartPanel.classList.toggle("collapsed", !open);
        cartToggle.setAttribute("aria-expanded", open ? "true" : "false");
        cartToggle.textContent = open ? "장바구니 접기 ▴" : "장바구니 열기 ▾";
      }

      if(cartToggle){
        cartToggle.addEventListener("click", function(){
          const isCollapsed = cartPanel.classList.contains("collapsed");
          setCartOpen(isCollapsed);
        });
        setCartOpen(true);
      }
    })();
  </script>
